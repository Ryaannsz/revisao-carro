spring.application.name=revisaoCarro

# ---------- Banco (MySQL) ----------
# Produção/CI-CD: SPRING_DATASOURCE_URL/USERNAME/PASSWORD. Local: MYSQL_* e DB_* com defaults.
# DB_USERNAME/DB_PASSWORD: "USERNAME" não serve (é variável especial no zsh e fixa no Windows)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE_APP:mydb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:1234}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# "trace" aqui despejava todo SQL e parâmetros (inclusive hash de senha) no log
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:warn}
logging.level.org.hibernate.orm.jdbc.bind=${SQL_LOG_LEVEL:warn}

spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ---------- Segurança ----------
# Em produção SEMPRE defina JWT_SECRET (o default é só para desenvolvimento)
api.security.token.secret=${JWT_SECRET:palavrachavetestejwtrevisao}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:8}
# Origens liberadas no CORS (separadas por vírgula, aceita curinga)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,https://revisao-carro.vercel.app}

springdoc.swagger-ui.path=/docs

# ---------- Seed inicial ----------
# Empresa id=1 + ADMIN sempre são garantidos (idempotente). Troque a senha após o 1º login.
bootstrap.empresa.nome=${BOOTSTRAP_EMPRESA_NOME:Empresa Demo}
bootstrap.empresa.cnpj=${BOOTSTRAP_EMPRESA_CNPJ:00000000000001}
bootstrap.user.senha=${BOOTSTRAP_ADMIN_SENHA:123456}
bootstrap.user.nome=${BOOTSTRAP_ADMIN_NOME:admin}
bootstrap.user.cpf=${BOOTSTRAP_ADMIN_CPF:12345678901}
# true = gera carros/abastecimentos/revisões fictícios (só se a base estiver vazia)
bootstrap.demo-data=${BOOTSTRAP_DEMO_DATA:false}
