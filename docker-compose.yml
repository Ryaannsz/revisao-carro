version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mydb
      USERNAME: user
      PASSWORD: password
    depends_on:
      - db

  bff:
    build:
      context: ./bff
    ports:
      - "8070:8070"   
    environment:
      API_URL: "http://api.backend:8080"  
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - bff

volumes:
  postgres-data:
