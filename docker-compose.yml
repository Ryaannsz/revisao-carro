version: "3.8"

services:
  db:
    image: mysql:5.7  # Usando imagem do PostgreSQL
    restart: always
    environment:
      MYSQL_DATABASE: mydb  # Nome do banco de dados
      MYSQL_ROOT_PASSWORD: 1234  # Senha do banco
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "3306:3306"  # Expondo a porta 5432 do PostgreSQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 5s
      timeout: 3s
      retries: 50

  backend:
    build:
      context: ./backend
    ports:
      - "8090:8080"
    environment:
      MYSQL_HOST: db  # Nome do serviço do banco
      MYSQL_PORT: 3306  # Porta do PostgreSQL
      MYSQL_DATABASE_APP: mydb  # Nome do banco de dados
      USERNAME: root  # Nome de usuário
      PASSWORD: 1234  # Senha
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
