version: "3.8"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  db_auth:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: authdb
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

  auth-server:
    build:
      context: ./autenticator
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL_AUTH: jdbc:postgresql://db_auth:5432/authdb
      USERNAME_AUTH: auth_user
      PASSWORD_AUTH: auth_pass
    depends_on:
      - db_auth

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mydb
      USERNAME: user
      PASSWORD: password
    depends_on:
      - db

  bff:
    build:
      context: ./bff
    ports:
      - "8070:8070"
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend
      - auth-server

  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - bff

volumes:
  postgres-data:
  auth-postgres-data:
