<div class="overlay" (click)="close.emit()">
  <form class="sheet" role="dialog" aria-modal="true" aria-label="Criar usuário" [formGroup]="userForm" (ngSubmit)="submit()" (click)="$event.stopPropagation()" novalidate>
    <div class="sheet-head">
      <h2 class="sheet-title">Criar usuário</h2>
      <button type="button" class="icon-btn -mr-2" (click)="close.emit()" aria-label="Fechar"><fa-icon [icon]="['fas', 'times']"></fa-icon></button>
    </div>

    <div class="p-5 flex flex-col gap-4 overflow-y-auto">
      <div class="field">
        <label for="nome" class="field-label">Nome</label>
        <input id="nome" formControlName="nome" type="text" class="input" autocomplete="off" placeholder="Nome e sobrenome">
        <p *ngIf="nome?.invalid && (nome?.dirty || nome?.touched)" class="field-error">Informe o nome (mínimo 2 letras).</p>
      </div>

      <div class="field">
        <label for="cpf" class="field-label">CPF</label>
        <input id="cpf" formControlName="cpf" type="text" inputmode="numeric" maxlength="11" class="input num tracking-wider" placeholder="Somente números" (input)="formatCpf($event)">
        <p *ngIf="cpf?.invalid && (cpf?.dirty || cpf?.touched)" class="field-error">O CPF tem 11 números.</p>
        <p *ngIf="!(cpf?.invalid && (cpf?.dirty || cpf?.touched))" class="field-hint">É o login da pessoa.</p>
      </div>

      <div class="field">
        <label for="senha" class="field-label">Senha inicial</label>
        <div class="relative">
          <input id="senha" formControlName="senha" [type]="showPassword ? 'text' : 'password'" class="input pr-20" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">
          <button type="button" (click)="showPassword = !showPassword" class="absolute right-1.5 top-1/2 -translate-y-1/2 h-9 px-3 rounded text-sm font-semibold text-ink-soft hover:text-ink hover:bg-paper">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <p *ngIf="senha?.invalid && (senha?.dirty || senha?.touched)" class="field-error">A senha precisa de pelo menos 6 caracteres.</p>
      </div>

      <div class="field">
        <span class="field-label">Acesso</span>
        <div class="seg w-full">
          <button type="button" class="seg-btn flex-1 justify-center" [class.is-on]="userForm.value.roles === 'USER'" (click)="userForm.patchValue({ roles: 'USER' })">Operador</button>
          <button type="button" class="seg-btn flex-1 justify-center" [class.is-on]="userForm.value.roles === 'ADMIN'" (click)="userForm.patchValue({ roles: 'ADMIN' })">Administrador</button>
        </div>
      </div>
    </div>

    <div class="px-5 pb-5 pt-1 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
      <button type="button" class="btn-ghost" (click)="close.emit()">Cancelar</button>
      <button type="submit" class="btn-primary">Criar usuário</button>
    </div>
  </form>
</div>
