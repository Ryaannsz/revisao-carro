<!-- dashboard.component.html -->
<div class="p-6 grid grid-cols-1 xl:grid-cols-2 gap-6" *ngIf="vm$ | async as vm">
  <section class="rounded-2xl shadow p-4 bg-white">
    <h2 class="text-lg font-semibold mb-2">Gasto mensal (R$)</h2>
    <app-line-chart [labels]="vm.gasto.labels" [datasets]="vm.gasto.datasets"></app-line-chart>
  </section>

  <section class="rounded-2xl shadow p-4 bg-white">
    <h2 class="text-lg font-semibold mb-2">Litros por mês (L)</h2>
    <app-line-chart [labels]="vm.litros.labels" [datasets]="vm.litros.datasets"></app-line-chart>
  </section>

  <section class="rounded-2xl shadow p-4 bg-white">
    <h2 class="text-lg font-semibold mb-2">Eficiência (km/L)</h2>
    <app-line-chart [labels]="vm.eficiencia.labels" [datasets]="vm.eficiencia.datasets"></app-line-chart>
  </section>

  <section class="rounded-2xl shadow p-4 bg-white">
    <h2 class="text-lg font-semibold mb-2">Revisões por mês</h2>
    <app-line-chart [labels]="vm.revisoes.labels" [datasets]="vm.revisoes.datasets"></app-line-chart>
  </section>

  <section class="rounded-2xl shadow p-4 bg-white xl:col-span-2">
    <h2 class="text-lg font-semibold mb-2">Próximas revisões</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead>
          <tr class="text-left">
            <th class="p-2">Placa</th>
            <th class="p-2">Última</th>
            <th class="p-2">Próxima (estimada)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let x of vm.proximas" class="border-t">
            <td class="p-2">{{ x.placa }}</td>
            <td class="p-2">{{ x.ultimaRevisao | date:'shortDate' }}</td>
            <td class="p-2">{{ x.proximaRevisaoEstimada | date:'shortDate' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
