<div class="page-narrow">
  <header class="mb-6">
    <h1 class="page-title">Cadastrar modelo</h1>
    <p class="page-sub">Também dá para criar modelos direto no cadastro de carro ou de máquina.</p>
  </header>
  <form [formGroup]="modeloForm" (ngSubmit)="cadastrarModelo()" class="panel panel-body flex flex-col sm:flex-row sm:items-end gap-3" novalidate>
    <div class="field flex-1">
      <label class="field-label" for="modelo">Nome do modelo</label>
      <input id="modelo" formControlName="modelo" type="text" class="input" placeholder="Ex.: Strada, 416F">
      <p *ngIf="modeloForm.get('modelo')?.invalid && modeloForm.get('modelo')?.touched" class="field-error">Informe o nome do modelo.</p>
    </div>
    <button type="submit" class="btn-primary" [disabled]="loading">Cadastrar modelo</button>
  </form>
</div>

<app-loading [visible]="loading" message="Salvando modelo"></app-loading>
