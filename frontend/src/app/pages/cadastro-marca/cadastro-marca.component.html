<div class="page-narrow">
  <header class="mb-6">
    <h1 class="page-title">Cadastrar marca</h1>
    <p class="page-sub">Também dá para criar marcas direto no cadastro de carro ou de máquina.</p>
  </header>
  <form [formGroup]="marcaForm" (ngSubmit)="cadastrarMarca()" class="panel panel-body flex flex-col sm:flex-row sm:items-end gap-3" novalidate>
    <div class="field flex-1">
      <label class="field-label" for="marca">Nome da marca</label>
      <input id="marca" formControlName="marca" type="text" class="input" placeholder="Ex.: Fiat, Caterpillar">
    </div>
    <button type="submit" class="btn-primary" [disabled]="loading">Cadastrar marca</button>
  </form>
</div>

<app-loading [visible]="loading" message="Salvando marca"></app-loading>
