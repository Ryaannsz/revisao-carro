<div class="bg-white rounded-xl w-[min(92vw,26rem)] p-6 shadow-[0_20px_60px_-15px_rgba(34,48,43,.5)] transition-all duration-200"
     [ngClass]="isOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-95'" role="alertdialog" aria-modal="true">
  <h2 class="font-cond font-semibold text-2xl leading-tight mb-2">{{ data.title }}</h2>
  <p class="text-ink-soft mb-6">{{ data.message }}</p>
  <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
    <button class="btn-ghost" (click)="cancel()">Cancelar</button>
    <button class="btn bg-over text-white hover:bg-[#962015]" (click)="confirm()">{{ data.confirmLabel || 'Excluir' }}</button>
  </div>
</div>
