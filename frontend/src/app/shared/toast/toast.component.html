<div class="fixed z-[80] inset-x-3 top-3 sm:inset-x-auto sm:right-5 sm:top-5 sm:w-96 flex flex-col gap-2 pointer-events-none"
     style="padding-top: env(safe-area-inset-top, 0px)" aria-live="polite">
  <div *ngFor="let toast of toasts$ | async"
       class="pointer-events-auto flex items-start gap-3 rounded-lg bg-ink text-white pl-3 pr-2 py-3 shadow-[0_12px_30px_-10px_rgba(34,48,43,.6)] animate-pop-in"
       role="status">
    <span class="mt-1 w-2.5 h-2.5 rounded-full shrink-0"
          [ngClass]="{
            'bg-[#5FD08F]': toast.type === 'sucesso',
            'bg-[#FF8A7A]': toast.type === 'erro',
            'bg-white/70': toast.type === 'info',
            'bg-signal': toast.type === 'aviso'
          }"></span>
    <p class="flex-1 text-[15px] leading-snug">{{ toast.message }}</p>
    <button (click)="close(toast)" aria-label="Fechar aviso" class="w-8 h-8 -my-1 rounded text-white/60 hover:text-white hover:bg-white/10 shrink-0">✕</button>
  </div>
</div>
