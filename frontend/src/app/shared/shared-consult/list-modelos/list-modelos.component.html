<div class="field relative">
  <label class="field-label" [for]="inputId">{{ label }}</label>
  <input type="text" class="input" [id]="inputId" [class.!border-over]="invalido" [formControl]="modeloField"
    (focus)="isDropdownOpen = true" (blur)="onBlur()" (input)="isDropdownOpen = true" autocomplete="off"
    role="combobox" aria-autocomplete="list" [attr.aria-expanded]="isDropdownOpen" placeholder="Digite para buscar ou criar" />

  <ul *ngIf="isDropdownOpen && ((filteredModelos$ | async)?.length || showCreateButton)"
    class="absolute z-30 top-full mt-1 inset-x-0 max-h-64 overflow-auto rounded-md border border-line-strong bg-white py-1 shadow-[0_12px_30px_-12px_rgba(34,48,43,.35)]" role="listbox">
    <li *ngFor="let item of filteredModelos$ | async" (mousedown)="$event.preventDefault()" (click)="selectModelo(item)"
      class="cursor-pointer px-3.5 py-2.5 capitalize hover:bg-paper" role="option" [attr.aria-selected]="item.modelo === modeloField.value">
      {{ item.modelo }}
    </li>
    <li *ngIf="showCreateButton" (mousedown)="$event.preventDefault()" (click)="criarNovoModelo()"
      class="cursor-pointer px-3.5 py-2.5 border-t border-line font-semibold hover:bg-signal-soft flex items-center gap-2" role="option">
      <fa-icon [icon]="['fas', 'plus']" class="text-ink-soft"></fa-icon> Cadastrar “{{ modeloField.value }}”
    </li>
  </ul>
</div>
