<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5" novalidate>
  <div class="field">
    <label for="cpf" class="field-label">CPF</label>
    <input id="cpf" type="text" inputmode="numeric" autocomplete="username" maxlength="11"
      formControlName="cpf" class="input num text-lg tracking-wider" placeholder="Somente números" (input)="somenteDigitos($event)">
    <p *ngIf="loginForm.get('cpf')?.invalid && loginForm.get('cpf')?.touched" class="field-error">
      O CPF tem 11 números.
    </p>
  </div>

  <div class="field">
    <label for="senha" class="field-label">Senha</label>
    <div class="relative">
      <input id="senha" [type]="mostrarSenha ? 'text' : 'password'" autocomplete="current-password"
        formControlName="senha" class="input pr-20" placeholder="Mínimo de 6 caracteres">
      <button type="button" (click)="mostrarSenha = !mostrarSenha"
        class="absolute right-1.5 top-1/2 -translate-y-1/2 h-9 px-3 rounded text-sm font-semibold text-ink-soft hover:text-ink hover:bg-paper">
        {{ mostrarSenha ? 'Ocultar' : 'Mostrar' }}
      </button>
    </div>
    <p *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched" class="field-error">
      A senha tem pelo menos 6 caracteres.
    </p>
  </div>

  <p *ngIf="error" class="rounded-md bg-over-soft text-over px-3.5 py-3 text-[15px] font-medium" role="alert">
    {{ error }}
  </p>

  <button type="submit" class="btn-primary h-12 text-base mt-1" [disabled]="isLoading">
    <svg *ngIf="isLoading" class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3" />
      <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
    </svg>
    {{ isLoading ? 'Entrando…' : 'Entrar' }}
  </button>
</form>
