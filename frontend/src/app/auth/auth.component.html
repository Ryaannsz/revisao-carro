<div class="min-h-screen grid lg:grid-cols-[1.1fr_1fr] bg-paper">

  <!-- Lado da marca -->
  <section class="bg-ink text-white px-6 pt-10 pb-12 sm:px-10 lg:px-16 lg:py-16 flex flex-col"
           style="padding-top: max(2.5rem, env(safe-area-inset-top, 0px))">
    <div class="flex items-center gap-3">
      <svg viewBox="0 0 32 32" class="w-9 h-9" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="6" fill="#F5B800" />
        <path d="M16 6.5a9.5 9.5 0 1 0 9.5 9.5" fill="none" stroke="#22302B" stroke-width="2.6" stroke-linecap="round" />
        <path d="M16 16l6.2-5.2" stroke="#22302B" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="16" cy="16" r="2.3" fill="#22302B" />
      </svg>
      <span class="font-cond font-bold text-2xl tracking-wide">Frota</span>
    </div>

    <div class="mt-10 lg:mt-auto lg:mb-auto max-w-xl">
      <h1 class="font-cond font-semibold text-white text-[2.6rem] leading-[1.02] sm:text-[3.4rem] lg:text-[4.2rem]">
        Cada carro e cada máquina, com a revisão em dia.
      </h1>
      <p class="mt-5 text-white/70 text-lg max-w-md">
        Lance abastecimentos, horímetro e manutenções pelo celular. O sistema avisa o que está vencendo.
      </p>
      <div class="mt-8 flex flex-wrap items-end gap-x-8 gap-y-5">
        <div>
          <p class="text-[13px] text-white/50 mb-2">Odômetro</p>
          <app-medidor [valor]="48215" unidade="km" [digitos]="6" size="lg" [animar]="true"></app-medidor>
        </div>
        <div class="hidden sm:block">
          <p class="text-[13px] text-white/50 mb-2">Horímetro</p>
          <app-medidor [valor]="2487.6" unidade="h" [digitos]="5" [decimais]="1" size="lg" [animar]="true"></app-medidor>
        </div>
      </div>
    </div>
  </section>

  <!-- Formulário -->
  <section class="flex items-start lg:items-center justify-center px-6 py-10 sm:px-10">
    <div class="w-full max-w-sm">
      <h2 class="font-cond font-semibold text-3xl">Entrar</h2>
      <p class="text-ink-soft mt-1 mb-7">Use o CPF e a senha que o administrador cadastrou.</p>
      <app-login></app-login>
    </div>
  </section>
</div>
