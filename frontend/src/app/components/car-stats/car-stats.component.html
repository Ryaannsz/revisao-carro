<div class="flex flex-col gap-5">
  <!-- Controles em uma linha (quebram no celular) -->
  <div class="flex flex-wrap items-center gap-3">
    <div class="seg" role="radiogroup" aria-label="Modo">
      <button class="seg-btn" role="radio" [class.is-on]="mode === 'compare'" [attr.aria-checked]="mode === 'compare'" (click)="setMode('compare')">Comparar</button>
      <button class="seg-btn" role="radio" [class.is-on]="mode === 'sum'" [attr.aria-checked]="mode === 'sum'" (click)="setMode('sum')">Somar</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Período">
      <button *ngFor="let p of periodos" class="seg-btn" role="radio" [class.is-on]="months === p.v" [attr.aria-checked]="months === p.v" (click)="setMonths(p.v)">{{ p.l }}</button>
    </div>
    <button class="btn-outline btn-sm sm:ml-auto" (click)="generateReport()" [disabled]="gerandoPdf || !selectedIds.length">
      <fa-icon [icon]="['fas', 'file-pdf']"></fa-icon> {{ gerandoPdf ? 'Gerando…' : 'Baixar PDF' }}
    </button>
  </div>

  <!-- Escolha dos carros -->
  <div>
    <div class="flex items-center justify-between gap-3 mb-2">
      <p class="text-sm font-semibold">
        Carros <span class="text-ink-soft font-medium">({{ selectedIds.length }} de {{ allCars.length }}<ng-container *ngIf="mode === 'compare'">, até {{ max }} para comparar</ng-container>)</span>
      </p>
      <div class="flex gap-1">
        <button class="btn-ghost btn-sm" (click)="selectAll()">Todos</button>
        <button class="btn-ghost btn-sm" (click)="clearAll()" [disabled]="!selectedIds.length">Limpar</button>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 max-h-44 overflow-y-auto">
      <button *ngFor="let c of allCars" type="button" (click)="toggle(c.id)" [attr.aria-pressed]="isSel(c.id)"
        class="inline-flex items-center gap-2 h-9 pl-2.5 pr-3 rounded-md border text-sm font-semibold transition-colors"
        [ngClass]="isSel(c.id) ? 'bg-ink text-white border-ink' : 'bg-white border-line-strong hover:border-ink'">
        <span class="w-2.5 h-2.5 rounded-sm" [style.background]="isSel(c.id) && mode === 'compare' ? cor(c.id) : 'transparent'"
          [class.border]="!isSel(c.id) || mode !== 'compare'" [class.border-current]="!isSel(c.id) || mode !== 'compare'"></span>
        <span class="font-cond tracking-wider uppercase text-[15px]">{{ c.label }}</span>
      </button>
    </div>
  </div>

  <div *ngIf="!selectedIds.length" class="rounded-lg bg-paper px-5 py-10 text-center text-ink-soft">
    Escolha um ou mais carros acima para ver os gráficos.
  </div>

  <div *ngIf="selectedIds.length" class="grid gap-6 xl:grid-cols-2" [class.opacity-60]="loading">
    <div>
      <h3 class="font-cond font-semibold text-lg mb-2">Gasto por mês</h3>
      <app-line-chart type="bar" [labels]="vm.labels" [datasets]="vm.gasto" [options]="opcoesMoeda" height="16rem" ariaLabel="Gasto mensal por carro"></app-line-chart>
    </div>
    <div>
      <h3 class="font-cond font-semibold text-lg mb-2">Litros por mês</h3>
      <app-line-chart [labels]="vm.labels" [datasets]="vm.litros" [options]="opcoesNumero" height="16rem" ariaLabel="Litros por mês por carro"></app-line-chart>
    </div>
    <div class="xl:col-span-2">
      <h3 class="font-cond font-semibold text-lg mb-2">Consumo (km/L){{ mode === 'sum' ? ', média ponderada' : '' }}</h3>
      <app-line-chart [labels]="vm.labels" [datasets]="vm.eficiencia" [options]="opcoesNumero" height="16rem" ariaLabel="Consumo em km por litro por mês"></app-line-chart>
    </div>
  </div>
</div>
