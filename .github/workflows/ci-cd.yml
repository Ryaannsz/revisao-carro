name: CI/CD Backend + Frontend

on:
  push:
    branches: [ "main" ]


jobs:
  backend-tests-and-build:
    name: Backend - Test & Build & Push Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Maven
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Rodar testes do backend
        run: mvn test

      - name: Build do JAR 
        run: mvn -B package -DskipTests

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem do backend
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/revisao-backend"
          TAG="${{ github.sha }}"
          LATEST_TAG="latest"

          docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:$LATEST_TAG .
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$LATEST_TAG

  frontend-build-and-push:
    name: Frontend - Build & Push Image
    runs-on: ubuntu-latest
    needs: backend-tests-and-build  

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Build do frontend (Angular)
        run: npm run build -- --configuration production

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem do frontend
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/revisao-frontend"
          TAG="${{ github.sha }}"
          LATEST_TAG="latest"

          docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:$LATEST_TAG .
          docker push $IMAGE_NAME:$TAG
          docker push $IMAGE_NAME:$LATEST_TAG